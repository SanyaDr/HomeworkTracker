<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Tracker - Электронный журнал{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/static/bootstrap-5.3.8/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/static/fontawesome-6.4.0-web/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="/static/css/googleFontApi.css">

    <link rel="stylesheet" href="/static/css/base.css">

    {% block extra_css %}{% endblock %}
</head>
<body>
<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-tasks"></i> Task Tracker
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- Навигация для гостей -->
            <div id="guest-nav" class="navbar-nav ms-auto" style="display: none;">
                <li class="nav-item">
                    <a class="nav-link" href="/login">Вход</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-primary ms-2" href="/register">Регистрация</a>
                </li>
            </div>

            <!-- Навигация для авторизованных -->
            <div id="user-nav" class="navbar-nav ms-auto" style="display: none;">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        <div class="user-avatar me-2" id="user-avatar">
                            U
                        </div>
                        <span id="user-name">Пользователь</span>
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/dashboard"><i class="fas fa-tachometer-alt me-2"></i>Дашборд</a></li>
                        <li><a class="dropdown-item" href="/profile"><i class="fas fa-user me-2"></i>Профиль</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Выйти</a></li>
                    </ul>
                </li>
            </div>
        </div>
    </div>
</nav>

<!-- Основной контент -->
<main>
    {% block content %}{% endblock %}
</main>

<!-- Футер -->
<footer class="py-4 mt-5">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <p class="mb-0">&copy; {{ current_year }} Task Tracker. Все права защищены.</p>
            </div>
            <div class="col-md-6 text-md-end">
                <a href="/about" class="text-white me-3">О проекте</a>
                <a href="/about" class="text-white">Контакты</a>
            </div>
        </div>
    </div>
</footer>


<!-- Bootstrap JS -->
<script src="/static/bootstrap-5.3.8/js/bootstrap.bundle.min.js"></script>
<!-- Axios для HTTP запросов -->
<script src="/static/axios/js/axios.min.js"></script>

<script src="/static/js/base.js"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
